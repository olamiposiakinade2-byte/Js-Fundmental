<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reanxis Customer Account</title>
    <style>
        :root { color: #17332d; background: #f3f7f5; font-family: 'DM Sans', Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top right, #e6f49d, transparent 38%), #f3f7f5; }
        main { width: min(440px, 92%); padding: 34px; background: white; border: 1px solid #dce9e3; border-radius: 24px; box-shadow: 0 24px 60px rgba(23, 62, 53, .12); }
        .brand { color: #1d806c; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
        h1 { margin: 10px 0 8px; font-family: Georgia, serif; font-size: 38px; }
        p { color: #648077; line-height: 1.6; }
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 26px 0; }
        .tabs button { padding: 11px; border: 1px solid #dce9e3; border-radius: 10px; background: #f3f7f5; color: #55736a; cursor: pointer; }
        .tabs button.active { background: #173e35; color: white; border-color: #173e35; }
        label { display: block; margin: 16px 0 7px; font-weight: 700; font-size: 13px; }
        input { width: 100%; padding: 13px; border: 1px solid #cbded6; border-radius: 10px; font: inherit; }
        button[type="submit"] { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 11px; background: #1d806c; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        #message { min-height: 24px; margin-top: 16px; color: #b23838; font-size: 14px; }
        a { color: #1d806c; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <div class="brand">Reanxis Pharmacy</div>
        <h1 id="title">Welcome back</h1>
        <p id="description">Sign in to keep your orders and payment receipts together.</p>
        <div class="tabs">
            <button type="button" class="active" data-mode="login">Sign in</button>
            <button type="button" data-mode="register">Create account</button>
        </div>
        <form id="authForm">
            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" type="password" minlength="8" autocomplete="current-password" required>
            <button type="submit" id="submitButton">Sign in</button>
        </form>
        <p id="message" role="alert"></p>
        <a href="/">Back to Reanxis Pharmacy</a>
    </main>
    <script>
        window.REANXIS_API_BASE_URL = "";
    </script>
    <script src="login.js"></script>
</body>
</html>
