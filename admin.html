<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBite Pharmacy Admin Payments</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; color: #202020; }
        form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
        input, button { font: inherit; padding: .7rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: .7rem; text-align: left; }
        th { background: #f1edff; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <h1>CampusBite payments</h1>
    <form id="adminForm">
        <input id="adminToken" type="password" placeholder="Admin token" required>
        <button type="submit">Load payments</button>
    </form>
    <p id="message"></p>
    <table>
        <thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Provider</th><th>Reference</th><th>Status</th><th>Created</th><th>Verified</th></tr></thead>
        <tbody id="payments"></tbody>
    </table>
    <script src="admin.js?v=2"></script>
</body>
</html>
