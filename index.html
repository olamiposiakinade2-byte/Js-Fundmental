<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference ticket generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="logo">
        <img src="/conference-ticket-generator-main/conference-ticket-generator-main/assets/images/logo-full.svg" alt="">
    </header>

    <section id="hero">
        <h1>Your Journey to Coding Conf <br> 2025 Starts Here</h1>
        <h6>Secure your spot at next year's biggest coding conference.</h6>
    </section>

    <main>
        <section id="form">
            <form action="">
                <label for="avatar">Upload Avatar</label>
                <input type="file" id="avatar" accept=".jpg, .jpeg, .png">
                <p>Drag and drop or click to upload</p>
                <p>Upload your photo (JPG or PNG, max size: 500KB).</p>
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name" required>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </form>
            <button>Generate My Ticket</button>
        </section>
    </main>
 <script src="script.js"></script>
</body>
</html>
